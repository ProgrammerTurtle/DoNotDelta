[include mainsail.cfg]

# host MCU service is preinstalled and ready to use with:
## [mcu RPI]
## serial: /tmp/klipper_host_mcu

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_360031000A50534E4E313020-if00

# [include generic-bigtreetech-octopus-v1.1.cfg]

# Physically on Driver6 - REAL toolhead mechanism (confirmed 2026-07-12:
# stepper_a/b/c are wired to the bed, stepper_d/e/f to the toolhead - the
# opposite of this project's initial assumption). colinear_delta.py assigns
# the toolhead role by section NAME (stepper_a/b/c), unconditionally, so the
# wiring is swapped here to match reality rather than changing the code.
[stepper_a]
step_pin: PE2
dir_pin: PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PG14
#position_endstop: 36.6
homing_speed: 60
#arm_length: 76.5
homing_retract_dist: 10

[tmc2209 stepper_a]
uart_pin: PE1
run_current: 1.0
stealthchop_threshold: 999999
sense_resistor: 0.150

# Physically on Driver4 - REAL toolhead mechanism
[stepper_b]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PG12
#position_endstop: 36.6
homing_speed: 60
homing_retract_dist: 10

[tmc2209 stepper_b]
uart_pin: PF2
run_current: 1.0
stealthchop_threshold: 999999
sense_resistor: 0.150

# Physically on Driver2 - REAL toolhead mechanism
[stepper_c]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PG10
#position_endstop: 36.6
homing_speed: 60
homing_retract_dist: 10

[tmc2209 stepper_c]
uart_pin: PC6
run_current: 1.0
stealthchop_threshold: 999999
sense_resistor: 0.150

# Physically on Driver7 - REAL bed mechanism, shares stepper_a's rail
[stepper_d]
step_pin: PE6
dir_pin: PA14
enable_pin: !PE0
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PG15
position_endstop: 36.6
homing_speed: 60
arm_length: 76.5
homing_retract_dist: 10

[tmc2209 stepper_d]
uart_pin: PD3
run_current: 1.0
stealthchop_threshold: 999999
sense_resistor: 0.150

# Physically on Driver5 - REAL bed mechanism, shares stepper_b's rail
[stepper_e]
step_pin: PC13
dir_pin: PF0
enable_pin: !PF1
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PG13
homing_retract_dist: 10

[tmc2209 stepper_e]
uart_pin: PE4
run_current: 1.0
stealthchop_threshold: 999999
sense_resistor: 0.150

# Physically on Driver3 - REAL bed mechanism, shares stepper_c's rail
[stepper_f]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA0
microsteps: 16
rotation_distance: 32
full_steps_per_rotation: 400
endstop_pin: ^PG11
homing_retract_dist: 10

[tmc2209 stepper_f]
uart_pin: PC7
run_current: 1.0
stealthchop_threshold: 999999
sense_resistor: 0.150


[heater_fan hotend_fan]
pin: PA8

[heater_bed]
heater_pin: PA1
sensor_pin: PF3
sensor_type: Generic 3950
control: watermark
min_temp: 0
max_temp: 130

#[heater_fan fan1]
#pin: PE5

#[heater_fan fan2]
#pin: PD12

#[heater_fan fan3]
#pin: PD13

#[heater_fan fan4]
#pin: PD14

#[controller_fan fan5]
#pin: PD15


[printer]
kinematics: colinear_delta
max_velocity: 300
max_accel: 100000
max_z_velocity: 5
max_z_accel: 100
print_radius: 45
#delta_radius: 38.5
motion_split: 0.5
secondary_rotation: 180
# This machine mounts the toolhead mechanism at the bottom (nozzle pointing
# up) and the bed mechanism at the top, the opposite of the "carriages below
# the plate" assumption docs/Colinear_Delta.md describes as the default.
# Confirmed empirically 2026-07-11: with the default (bed_z_inverted: True),
# +Z moved the bed the wrong real-world direction (same way as the toolhead
# instead of the opposite way). See docs/Colinear_Delta.md for how to tell
# which case applies to a given machine.
bed_z_inverted: False
# All prior testing here was done with full_steps_per_rotation missing
# (defaulting to 200 instead of the real 400 for these 0.9deg motors), so
# every commanded distance only produced HALF its real physical effect.
# Now that's fixed, this same number will move twice as far in reality -
# pulled back down from 25 accordingly rather than assuming 25 is still
# an appropriate real-world distance.
homing_search_margin: 60.0
# Delta/bed-mesh calibration needs room to probe below the nominal
# bed-plane Z=0 reference (see docs/Delta_Calibrate.md) - widened further
# for BED_MESH_CALIBRATE since off-center points may sit notably lower
# than center if the bed isn't perfectly flat/parallel.
minimum_z_position: -15

[delta_calibrate]
radius: 25
speed: 40
# Default (5mm) put the pre-positioning height too close to the bed for
# at least one point on this uncalibrated machine - ACCEPT requires the
# final probed height to end up *below* this starting height, so if the
# true height at a point is above it, that point can never be accepted.
# More headroom here costs nothing but a slightly longer TESTZ descent.
horizontal_move_z: 10

[bed_mesh]
speed: 40
horizontal_move_z: 10
mesh_radius: 40
mesh_origin: 0, 0
round_probe_count: 5

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    G28
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    # No absolute Z_OFFSET here: BED_MESH_CALIBRATE probed in raw kinematic
    # Z (same as the earlier manual MANUAL_PROBE that found the -3.797
    # offset), so the mesh's own per-point correction already includes that
    # same absolute Z-zero misalignment. bed_mesh.move() adds its
    # correction on top of whatever Z the gcode layer already sent it, so
    # stacking a separate static offset on top double-applied the same
    # correction and drove the nozzle straight into the bed.
    BED_MESH_PROFILE LOAD=default
    # Small babystep on top of the mesh - nozzle was sitting a bit too
    # close to the bed (2026-07-13). Positive Z = more separation here.
    SET_GCODE_OFFSET Z=0.6

###########
# BOOMBOX #
###########

[extruder]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
microsteps: 32
rotation_distance: 11.615
###########################
heater_pin: PA2 # HE0
sensor_pin:  PF4 # T0
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -250
max_temp: 250
min_extrude_temp: 0 
nozzle_diameter: 0.400 
filament_diameter: 1.750 
max_extrude_cross_section: 5 
max_extrude_only_distance: 100.0 
pressure_advance: 0.076 
 
[tmc2209 extruder]
uart_pin: PC4
run_current: 0.75
stealthchop_threshold: 40
interpolate: False
sense_resistor: 0.150
uart_address: 0
# diag_pin: PG6
 
[extruder_stepper my_extra_stepper]
extruder = extruder
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 32
rotation_distance: 11.615
 
[tmc2209 extruder_stepper my_extra_stepper]
uart_pin: PD11
run_current:0.75
stealthchop_threshold: 40
interpolate: False
sense_resistor: 0.150
uart_address: 0
# diag_pin: PG9

